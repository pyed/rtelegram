version: 2
project_name: rtelegram

builds:
  - id: default
    binary: rtelegram
    main: .
    goos: [windows, darwin, linux]
    goarch: [amd64, arm64, "386", arm]
    # ARMv6 for the Raspberry Pi Zero and 1, ARMv7 for 32-bit systems on later Pis.
    goarm: ["6", "7"]
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats: ["zip"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"

checksum:
  name_template: checksums.txt

release:
  header: |
    {{ .TagBody }}

changelog:
  use: git
